name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master, main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # FACTORY_API_KEY + MCP_AUTH_TOKEN must be set as Cloudflare Worker secrets
          # via: wrangler secret put FACTORY_API_KEY  (run locally or add to CI)
